// Внутренний RPC-контракт Backend <-> Protocol Gateway (ТЗ п. 4.1: "Взаимодействие
// Backend API <-> Protocol Gateway выполняется по внутреннему RPC-протоколу,
// рекомендуется gRPC"). Этап 1 — только операция чтения одного регистра
// (ТЗ п. 4.2.3, "чтение текущих показаний"); журналы событий/вмешательств,
// профиль нагрузки, запись параметров — последующие этапы, добавляются сюда же.

syntax = "proto3";

package mmws.gateway.v1;

service GatewayService {
  // Читает одно значение (COSEM Register) со счётчика по одному из трёх
  // протокольных профилей Этапа 0. Синхронный RPC — асинхронность (job_id,
  // очередь) реализуется на стороне Backend, Gateway остаётся stateless
  // относительно пользователей/задач (Promt_MMWS.md, раздел 3, принцип 1).
  rpc ReadRegister(ReadRegisterRequest) returns (ReadRegisterResponse);

  // Записывает один атрибут COSEM-объекта (Этап 2, ТЗ п. 4.2.4). Как и
  // ReadRegister — синхронный RPC, асинхронность и аудит записи
  // (parameter_write_history) реализуются на стороне Backend.
  rpc WriteRegister(WriteRegisterRequest) returns (WriteRegisterResponse);

  // Проверка доступности конкретного экземпляра Gateway (используется
  // Backend'ом для heartbeat в реестре gateways, ТЗ п. 4.1.1).
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Профиль нагрузки (Этап 3, ТЗ п. 4.2.3) — server-streaming: каждая
  // строка буфера отдаётся отдельным сообщением сразу, как только она
  // полностью собрана из принятых датаблоков (см.
  // protocols.hdlc_dlms.read_load_profile), а не одним ответом по
  // завершении всей передачи. Именно ради этого сценария изначально
  // выбран gRPC (Promt_MMWS.md — потоковая передача данных профиля
  // нагрузки), а не обычный REST/HTTP между Backend и Gateway. Если
  // соединение со счётчиком обрывается посреди передачи, Backend
  // получает через RpcError все строки, отправленные ДО обрыва (не
  // теряет их) и решает, докачивать ли остаток (is_partial) — сам
  // Gateway не хранит состояние между вызовами (Promt_MMWS.md, раздел
  // 3, принцип 1).
  rpc ReadLoadProfile(ReadLoadProfileRequest) returns (stream ReadLoadProfileResponse);

  // Удалённое отключение/подключение счётчика (Этап 5, ТЗ п.4.2.10) —
  // ACTION-сервис DLMS на объект Disconnect Control (класс 70, рабочая
  // гипотеза адреса — см. DECISIONS.md). Синхронный RPC, как
  // ReadRegister/WriteRegister — асинхронность (job_id, batch_id при
  // пакетной операции от биллинга) реализуется на стороне Backend.
  rpc DisconnectMeter(DisconnectMeterRequest) returns (DisconnectMeterResponse);

  // Этап 6 (обнаружение новых счётчиков) — все серийные номера,
  // опознанные call-home пулом этого Gateway с момента запуска процесса
  // (см. callhome.CallHomePool.list_seen_serials), независимо от того,
  // уже ли Backend знает о них. Backend периодически опрашивает этот
  // метод и заводит в справочник ранее неизвестные серийники со
  // статусом "installed" — оператор видит их и решает, принимать ли в
  // работу, вместо того чтобы заранее знать серийный номер откуда-то ещё.
  rpc ListCallHomeSerials(ListCallHomeSerialsRequest) returns (ListCallHomeSerialsResponse);

  // Этап 6 — живая смена порта, который слушает call-home пул Gateway,
  // БЕЗ перезапуска процесса/контейнера (CallHomePool.stop()+start() на
  // новом порту). Используется панелью суперадминистратора.
  rpc SetCallHomePort(SetCallHomePortRequest) returns (SetCallHomePortResponse);
}

message ReadRegisterRequest {
  string profile = 1;       // "mode_c" | "mode_e" | "hdlc_dlms"
  string host = 2;           // игнорируется при call_home=true
  int32 port = 3;             // игнорируется при call_home=true
  string serial = 4;
  string password = 5;      // передаётся только на время вызова (Promt_MMWS.md, раздел 3, принцип 4)
  string obis = 6;           // 6-байтная hex-нотация A.B.C.D.E.F
  int32 timeout_ms = 7;      // 0 = использовать значение по умолчанию Gateway
  int32 retries = 8;         // 0 = использовать значение по умолчанию Gateway
  // Счётчик сам инициирует TCP-соединение к Gateway ("звонок домой" —
  // расхождение с ТЗ Table 1, подтверждено на реальном оборудовании
  // Risesun 2026-08-18, см. DECISIONS.md). При true Gateway не набирает
  // host:port, а берёт уже установленное соединение из пула call-home
  // листенера (protocols/callhome.py), подобранное по serial.
  bool call_home = 9;
  // COSEM class-id для запрашиваемого объекта. 0 = использовать
  // дефолт Gateway (Register, класс 3). Параметры Этапа 2 (напр.
  // «Current Time»/«Current Date», словарь OBIS RW_Tree_параметры) —
  // класс 1 (Data).
  int32 class_id = 10;
}

message ReadRegisterResponse {
  oneof result {
    ReadValue value = 1;
    ReadError error = 2;
  }
}

message ReadValue {
  // Значение атрибута DLMS, приведённое к JSON-совместимому виду
  // (число, строка, список — см. mmws_gateway.protocols.datatypes.decode_value).
  string value_json = 1;
}

message ReadError {
  string code = 1;          // TIMEOUT | AUTH_FAILED | CONNECTION_LOST | CRC_ERROR | GATEWAY_ERROR
  string message = 2;
  bool is_partial = 3;
  string raw_frame_hex = 4; // пусто, если сырой кадр не зафиксирован
}

message WriteRegisterRequest {
  string profile = 1;       // Этап 2 реализован только для "hdlc_dlms"
  string host = 2;
  int32 port = 3;
  string serial = 4;
  string password = 5;
  string obis = 6;
  int32 class_id = 7;        // 0 = дефолт Gateway (Register, класс 3)
  int32 attribute_id = 8;    // 0 = дефолт Gateway (2 = value)
  // Значение кодируется на стороне Gateway (Backend не знает DLMS —
  // Promt_MMWS.md, раздел 3, принцип 1) по дискриминатору value_type.
  // Сейчас поддержан только "octet_string"; остальные Common-Data-Types
  // добавляются по мере реализации следующих категорий записи (ТЗ
  // п.4.2.4: режимы отображения, тарифное расписание, профиль
  // нагрузки, GPRS).
  string value_type = 9;     // "octet_string"
  bytes value_bytes = 10;    // сырое содержимое для value_type="octet_string"
  int32 timeout_ms = 11;
  int32 retries = 12;
  bool call_home = 13;       // пока не реализовано, см. WriteError
}

message WriteRegisterResponse {
  oneof result {
    WriteSuccess success = 1;
    ReadError error = 2;     // тот же формат ошибки, что и у чтения
  }
}

message WriteSuccess {
  bool ok = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  string driver_version = 2;
  // Этап 6 — текущий порт call-home пула этого Gateway (0, если
  // call-home не запущен на этом экземпляре); Backend сохраняет
  // фактическое значение при каждом heartbeat, даже если оно было
  // изменено в обход панели (например, переменной окружения при
  // перезапуске контейнера).
  int32 call_home_port = 3;
}

message ListCallHomeSerialsRequest {}

message ListCallHomeSerialsResponse {
  repeated SeenSerial serials = 1;
}

message SeenSerial {
  string serial = 1;
  double first_seen_unix = 2;
}

message SetCallHomePortRequest {
  int32 port = 1;
}

message SetCallHomePortResponse {
  oneof result {
    SetCallHomePortSuccess success = 1;
    ReadError error = 2;
  }
}

message SetCallHomePortSuccess {
  int32 port = 1;
}

message ReadLoadProfileRequest {
  string profile = 1;       // Этап 3 реализован только для "hdlc_dlms"
  string host = 2;           // игнорируется при call_home=true
  int32 port = 3;
  string serial = 4;
  string password = 5;
  string obis = 6;           // рабочая гипотеза "1.0.63.1.0.ff" (decimal
                              // 1-0:99.1.0.255, стандартный DLMS "Load
                              // Profile 1") — в словаре OBIS.xlsx адрес
                              // самого буфера не задокументирован, см.
                              // DECISIONS.md
  int32 class_id = 7;        // 0 = дефолт Gateway (Profile Generic, класс 7)
  string from_iso = 8;       // ISO 8601, напр. "2026-08-01T00:00:00"
  string to_iso = 9;
  int32 timeout_ms = 10;
  int32 retries = 11;
  bool call_home = 12;       // пока не реализовано, см. ReadError
}

message ReadLoadProfileResponse {
  oneof result {
    LoadProfileRow row = 1;
    ReadError error = 2;     // тот же формат ошибки, что и у ReadRegister
  }
}

message DisconnectMeterRequest {
  string profile = 1;       // Этап 5 реализован только для "hdlc_dlms"
  string host = 2;           // игнорируется при call_home=true
  int32 port = 3;
  string serial = 4;
  string password = 5;
  string operation = 6;      // "disconnect" | "reconnect"
  int32 timeout_ms = 7;
  int32 retries = 8;
  bool call_home = 9;        // пока не реализовано, см. ReadError
}

message DisconnectMeterResponse {
  oneof result {
    WriteSuccess success = 1;
    ReadError error = 2;     // тот же формат ошибки, что и у ReadRegister/WriteRegister
  }
}

message LoadProfileRow {
  // Первая колонка строки буфера по конвенции — метка времени
  // (octet_string, 12 сырых байт cosem-date-time) — Gateway декодирует
  // её сам (Backend не реализует протокольную логику, Promt_MMWS.md,
  // раздел 3, принцип 1) и отдаёт готовым ISO 8601. Остальные колонки —
  // JSON-совместимый вид (тот же принцип, что и ReadValue.value_json).
  string timestamp_iso = 1;
  string values_json = 2;
}
