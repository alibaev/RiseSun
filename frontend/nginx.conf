server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS докера — без resolver+переменной nginx резолвит
    # backend:8000 ОДИН РАЗ при старте (proxy_pass с голым хостом без
    # переменной кэшируется на весь срок жизни воркер-процесса) и
    # продолжает стучаться в старый IP после пересборки/перезапуска
    # backend, пока не пересоздан сам frontend — 502 Bad Gateway
    # (найдено 2026-09-07: backend пересобирался несколько раз за время
    # жизни frontend, IP уехал, nginx этого не заметил). Переменная в
    # proxy_pass заставляет nginx резолвить заново по истечении valid.
    resolver 127.0.0.11 valid=10s;

    location /api/jobs/ {
        # WebSocket-эндпоинты живут под /api/jobs/*/stream — отдельный
        # location, чтобы включить upgrade-заголовки только там, где нужно.
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
