services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmws
      POSTGRES_PASSWORD: mmws
      POSTGRES_DB: mmws
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmws"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-risesun:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    # Событийное чтение call-home счётчиков сразу при подключении
    # (2026-09-09, см. DECISIONS.md и план ticklish-popping-bear.md) —
    # первый раз этому сервису вообще нужны env-переменные: внутренний
    # HTTP-канал к Backend'у, общий секрет читается из корневого .env
    # (не в git, см. .gitignore).
    environment:
      MMWS_BACKEND_INTERNAL_URL: http://backend:8000
      MMWS_GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET}
      # 2026-09-11, по просьбе пользователя — несколько дополнительных
      # call-home портов на этом же Gateway-процессе, чтобы можно было
      # разбить дозвон разных РЭСов по разным портам (диагностика +
      # организационное разделение трафика). Все ведут в один общий пул
      # соединений (см. CallHomePool) — с точки зрения опознания/чтения
      # разницы нет, с какого порта пришло соединение. Добавить ещё —
      # дописать сюда порт и добавить его же в секцию ports: ниже.
      # 2026-09-11 — 17 портов всего (2009 "Общий" + 16 конкретных РЭС/
      # объектов, см. app/services/res_mapping.py на Backend'е). Порт
      # 2026 пробовали как запасной, пользователь попросил закрыть —
      # не используется ни одним РЭС.
      MMWS_EXTRA_CALL_HOME_PORTS: "2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025"
    # Найдено 2026-09-10 (см. DECISIONS.md): процесс упирался в дефолтный
    # soft-лимит 1024 файловых дескриптора (1014 занято при окне held-
    # соединений DEFAULT_WINDOW_SIZE=1000 + gRPC/логи) — почти на пределе.
    # При исчерпании accept() новых call-home соединений может тихо не
    # успевать забирать их из очереди ядра, а счётчик при этом видит
    # нормальный TCP-хендшейк (SYN-ACK ядро отправляет само) — то есть
    # это самостоятельный вероятный источник картины "TCP жив, а выше
    # тишина", независимый от AARE/heartbeat-находок. Hard-лимит хоста
    # уже 524288 — просто не был запрошен.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:50051:50051"  # внутренний gRPC — наружу не нужен
      # Call-home порт (счётчик сам инициирует TCP-соединение — см.
      # DECISIONS.md) — ОБЯЗАН быть доступен со стороны реальной сети
      # счётчиков, не только localhost (аналогично тому, как открыт
      # 5173 у frontend).
      - "2009:2009"
      - "2010:2010"
      - "2011:2011"
      - "2012:2012"
      - "2013:2013"
      - "2014:2014"
      - "2015:2015"
      - "2016:2016"
      - "2017:2017"
      - "2018:2018"
      - "2019:2019"
      - "2020:2020"
      - "2021:2021"
      - "2022:2022"
      - "2023:2023"
      - "2024:2024"
      - "2025:2025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MMWS_DATABASE_URL: postgresql+asyncpg://mmws:mmws@postgres:5432/mmws
      MMWS_GATEWAY_GRPC_TARGET: gateway-risesun:50051
      MMWS_GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      gateway-risesun:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
